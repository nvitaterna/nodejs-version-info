name: Bump version and create release

on:
  # release whenever something that goes into the image lands on main (e.g.
  # an automerged Renovate update), so the published image stays current
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - tsconfig.build.json
  workflow_dispatch:

# cannot trigger another action from secrets.GITHUB_TOKEN
concurrency: production
jobs:
  tagAndRelease:
    name: Tag and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.PAT }}

      # github-tag-action v7+ returns no tag when there is nothing to release
      - name: Create a GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.PAT }}
