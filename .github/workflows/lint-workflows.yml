name: Lint workflows

# runs on every PR so there is always at least one check (Renovate only
# automerges once all checks on a PR have passed)
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # also runs shellcheck on every run: script
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
